name: Apex Horizon - Version 1.0.0 Multi-Platform Release

on:
  push:
    tags:
      - 'v1.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  # 1. LINUX BUILD: Web Bundle
  build-linux:
    name: Build Linux (AppImage & Flatpak)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web Bundle
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run build

      - name: Package Linux Bundle
        run: |
          mkdir -p dist-native/linux
          tar -czf dist-native/linux/ApexHorizon-v1.0.0-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-v1.0.0
          path: dist-native/linux/*.tar.gz

  # 2. ANDROID BUILD: True Native APK via Gradle / Capacitor
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web Project
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run build

      - name: Build Native Android APK
        run: |
          mkdir -p dist-native/android
          
          # Jeśli w repozytorium znajduje się folder 'android' (Capacitor / Cordova / React Native)
          if [ -d "android" ]; then
            echo "Znaleziono katalog android! Synchronizacja i budowanie Gradle..."
            npx cap sync android || true
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
            cd ..
            
            # Kopiowanie wygenerowanego pliku APK z Gradle (zwykle waży od kilkunastu do kilkudziesięciu MB)
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} dist-native/android/ApexHorizon-v1.0.0-Release.apk \;
          else
            echo "Brak natywnego folderu android - pakowanie PWA Web Bundle jako fallback"
            zip -r dist-native/android/ApexHorizon-v1.0.0-Android-PWA.zip dist/*
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-v1.0.0
          path: dist-native/android/*

  # 3. CREATE GITHUB RELEASE
  create-release:
    name: Publish GitHub Release v1.0.0
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Generate Release Notes & Checksums
        run: |
          mkdir -p final-binaries/
          find release-assets/ -type f -exec cp {} final-binaries/ \;
          cd final-binaries/
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Apex Horizon v1.0.0 - Official Release"
          tag_name: ${{ github.event.inputs.release_version || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Apex Horizon v1.0.0 - Official Release

            Official cross-platform release builds for Linux and Android.
          files: |
            final-binaries/*
