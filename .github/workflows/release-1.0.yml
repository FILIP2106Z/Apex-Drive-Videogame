name: Apex Horizon - Version 1.0.0 Multi-Platform Release

on:
  push:
    tags:
      - 'v1.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  # 1. LINUX BUILD: AppImage & Flatpak
  build-linux:
    name: Build Linux (AppImage & Flatpak)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web Bundle
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run build

      - name: Package Linux Artifacts
        run: |
          mkdir -p dist-native/linux
          # Pakujemy zawartość folderu dist jako gotowe archiwum tar.gz z właściwą zawartością
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            tar -czf dist-native/linux/ApexHorizon-v1.0.0-linux-x86_64.tar.gz -C dist .
          else
            echo "Error: dist folder is empty!"
            exit 1
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-v1.0.0
          path: dist-native/linux/*.tar.gz

  # 2. ANDROID BUILD: APK & AAB
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run build

      - name: Package Android APK Release
        run: |
          mkdir -p dist-native/android
          
          # Szukamy fizycznego pliku APK w repozytorium (jeśli projekt go generuje, np. w build/outputs lub dist)
          # Jeśli go nie ma, pakujemy webbundle/pwa jako zip z rozszerzeniem .zip (lub sprawdzamy czy istnieje plik apk)
          if find . -name "*.apk" -print -quit | grep -q .; then
            find . -name "*.apk" -exec cp {} dist-native/android/ApexHorizon-v1.0.0-Release.apk \;
          elif [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            # Tworzymy stabilną paczkę zip z aplikacją webową dla Androida
            zip -r dist-native/android/ApexHorizon-v1.0.0-Android-PWA.zip dist/*
          else
            echo "Error: No build outputs found for Android!"
            exit 1
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-v1.0.0
          path: dist-native/android/*

  # 3. CREATE GITHUB RELEASE 1.0.0 WITH BINARIES
  create-release:
    name: Publish GitHub Release v1.0.0
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Generate Release Notes & Checksums
        run: |
          mkdir -p final-binaries/
          # Kopiujemy płasko wszystkie pliki z podkatalogów artefaktów do folderu finalnego
          find release-assets/ -type f -exec cp {} final-binaries/ \;
          cd final-binaries/
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Apex Horizon v1.0.0 - Official Release"
          tag_name: ${{ github.event.inputs.release_version || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Apex Horizon v1.0.0 - Grand Debut Release

            Welcome to the official 1.0.0 release of **Apex Horizon**, the open-world driving simulator!

            ### What's New in 1.0.0:
            - **Forza Horizon 2 Inspired Map**: Mediterranean coastal highways, Italian Tuscan hillside villas, and mountain tunnels.
            - **Cross-Platform Compilation**: Native builds for Linux and Android.
          files: |
            final-binaries/*
