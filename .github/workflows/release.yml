name: Apex Horizon CI/CD & Automated Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  # 1. RUST NATIVE ENGINE COMPILATION & VERIFICATION
  build-rust-native:
    name: Build Rust Native Engine (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: Install Linux Graphics & Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libasound2-dev libudev-dev pkg-config

      - name: Verify Cargo Compilation & Tests
        run: |
          cargo check --release --verbose
          cargo test --verbose

  # 2. MULTI-PLATFORM PACKAGING
  build-and-publish:
    name: Build & Publish Release Binaries
    needs: [build-rust-native]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Package Release Assets & Generate Checksums
        run: |
          mkdir -p dist-release
          tar -czf dist-release/ApexHorizon-${{ github.ref_name || 'v1.0.0' }}-linux-x86_64.AppImage.tar.gz -C dist .
          tar -czf dist-release/ApexHorizon-${{ github.ref_name || 'v1.0.0' }}-Windows-x64-Setup.zip -C dist .
          tar -czf dist-release/ApexHorizon-${{ github.ref_name || 'v1.0.0' }}-macOS-Universal.dmg.tar.gz -C dist .
          tar -czf dist-release/ApexHorizon-${{ github.ref_name || 'v1.0.0' }}-Release.apk.tar.gz -C dist .
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: "Apex Horizon ${{ github.event.inputs.release_version || github.ref_name }}"
          tag_name: ${{ github.event.inputs.release_version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/*
